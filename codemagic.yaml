workflows:
  android-workflow:
    name: VoiceTap Android Build
    max_build_duration: 30
    instance_type: linux
    environment:
      groups:
        - keystore_credentials
      vars:
        PACKAGE_NAME: "com.example.voicetap"
      vm:
        node: 18
      flutter: none
    scripts:
      - name: Build debug APK
        script: |
          cd $CM_BUILD_DIR
          ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - didardlea@gmail.com
