
workflows:
  android-workflow:
    name: VoiceTap Android Build
    max_build_duration: 30
    environment:
      vars:
        PACKAGE_NAME: "com.example.voicetap"
    scripts:
      - name: Build debug APK
        script: |
          cd $CM_BUILD_DIR/VoiceTap
          gradle assembleDebug
    artifacts:
      - app/build/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - didardlea@gmail.com
